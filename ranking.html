<style>
:root{--paper:#f2ece0;--card:#fbf8f1;--ink:#1f1a15;--muted:#6c6153;--accent:#b3261e;--olive:#4b5d23;--line:rgba(31,26,21,.22)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--ink);padding:14px}
.head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:10px}
.head img{width:34px;height:34px;border-radius:7px}
.head h1{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:28px;line-height:1;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .per{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin-bottom:10px}
.tab{background:transparent;border:0;border-right:1px solid var(--ink);padding:9px 4px;font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.tab:last-child{border-right:0}.tab.on{background:var(--ink);color:var(--card)}
.rhead,.row{display:flex;gap:10px;align-items:baseline}
.rhead{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 2px 6px;border-bottom:1px solid var(--ink)}
ol{list-style:none;margin:0;padding:0;counter-reset:r}
li{counter-increment:r;border-bottom:1px solid var(--line);padding:7px 2px;font-size:14px}
li::before{content:counter(r,decimal-leading-zero);color:var(--muted);font-size:12px;width:22px;flex:none}
.rhead .c0{width:22px}.nm,.rhead .c1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dy,.rhead .c2{width:40px;text-align:right;color:var(--muted);font-size:12px}
.pt,.rhead .c3{width:46px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
li.first .nm{font-family:'Instrument Serif',Georgia,serif;font-size:19px}
.leaf{width:12px;height:12px;color:var(--olive);margin-left:5px;vertical-align:-1px}
.msg{font-size:12px;color:var(--muted);margin:12px 2px}
.play{display:block;margin-top:12px;text-align:center;border:1px solid var(--ink);padding:11px;color:var(--ink);text-decoration:none;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.play:hover{background:var(--ink);color:var(--card)}
</style>
</head>

async function load(){
  const box=document.getElementById('list');
  try{
    let url=`${SB_URL}/rest/v1/dimp_ranking?select=nome,puntos,device,vegano,dia&order=puntos.desc,creado.asc`;
    if(veg)url+='&vegano=eq.true';
    if(per==='d')url+=`&dia=eq.${ds(new Date())}&limit=${N}`;
    else if(per==='w'){const d=new Date();d.setDate(d.getDate()-6);url+=`&dia=gte.${ds(d)}&limit=3000`}
    else url+='&limit=10000';
    const r=await fetch(url,{headers:H});if(!r.ok)throw r.status;const rows=await r.json();
    let list;
    if(per==='d')list=rows.map(x=>({nome:x.nome,veg:x.vegano,val:x.puntos}));
    else{const m={};rows.forEach(x=>{const o=m[x.device]||(m[x.device]={nome:x.nome,sum:0,n:0,last:''});o.sum+=x.puntos;o.n++;if(x.dia>=o.last){o.last=x.dia;o.nome=x.nome}});
      list=Object.values(m).map(o=>({nome:o.nome,days:o.n,val:Math.round(o.sum/o.n),score:o.sum})).sort((a,b)=>b.score-a.score||b.val-a.val).slice(0,N)}
    box.innerHTML=list.length?`<ol>${list.map((x,i)=>`<li class="row${i===0?' first':''}"><span class="nm">${esc(x.nome)}${x.veg?LEAF:''}</span>${per==='d'?'':`<span class="dy">${x.days}</span>`}<span class="pt">${x.val}%</span></li>`).join('')}</ol>`:`<p class="msg">${t('empty')}</p>`;
  }catch(e){box.innerHTML=`<p class="msg">${t('off')}${typeof e==='number'?` (${e})`:''}</p>`}
  try{parent.postMessage({type:'ranking-height',game:'division-imposible',h:document.documentElement.scrollHeight},'*')}catch(e){}
}
render();
</script>
